[package]
name = "velocyto-rs"
version = "0.1.0"
edition = "2021"
description = "Faithful Rust translation of velocyto.py v0.17.16 — RNA velocity analysis for single-cell RNA-seq"
license = "BSD-2-Clause"
authors = ["Zhuoqing Fang"]
repository = "https://github.com/zqfang/velocyto-rs"
homepage = "https://github.com/zqfang/velocyto-rs"
readme = "README.md"
keywords = ["bioinformatics", "single-cell", "rna-velocity", "rna-seq", "genomics"]
categories = ["science", "command-line-utilities"]
# Keep the published package lean: ship only the crate sources, manifest, lockfile,
# README and license. Excludes the large sibling dirs that live in the repo root
# (velocyto.py/, hdf5-pure-rs/, tooling crates, tests/ BAM fixtures, examples/).
# Patterns use gitignore semantics; leading "/" anchors to the package root so
# bare names like README.md/LICENSE don't also match nested ones (e.g. velocyto.py/README.md).
include = [
    "/src/**/*.rs",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
]

[[bin]]
name = "velocyto-rs"
path = "src/main.rs"

[lib]
name = "velocyto"
path = "src/lib.rs"

[dependencies]
# HDF5 / loom I/O — pure Rust, no C library
hdf5-pure-rust = "0.3"
# BAM/SAM reading — pure Rust, no C library (replaces rust-htslib/htslib)
noodles-bam = { version = "0.90.0", optional = true }
noodles-sam = { version = "0.85.0", optional = true }
noodles-bgzf = { version = "0.47.0", optional = true }
# N-dimensional arrays
ndarray = { version = "0.15", features = ["rayon"] }
# Sparse matrices
sprs = "0.11"
# Statistical distributions
statrs = "0.17"
# Optimization (slope fitting)
argmin = "0.10"
argmin-math = { version = "0.4", features = ["ndarray_v0_15-nolinalg"] }
# ML — PCA, KNN
linfa = "0.7"
linfa-reduction = "0.7"
linfa-nn = "0.7"
# Parallelism (replaces Cython OpenMP + numba)
rayon = "1"
# CLI
clap = { version = "4", features = ["derive"] }
# Logging
log = "0.4"
env_logger = "0.11"
# Compression (for serialization)
flate2 = "1"
# Errors
thiserror = "2"
anyhow = "1"
# Regex (for GTF parsing in counter.rs)
regex = "1"
# Random number generation (for placeholder UMI)
rand = "0.8"
# Compile-time hash maps (for GEM_codes, CIGAR)
phf = { version = "0.11", features = ["macros"] }
# Temp spill files for the pure-Rust BAM tag sort (only needed with `bam`)
tempfile = { version = "3", optional = true }

[features]
# BAM/SAM I/O via the pure-Rust noodles crates. On by default since there is no
# longer a C toolchain requirement (the old rust-htslib dependency is gone).
# Build the dependency-light stub path with `cargo build --no-default-features`.
default = ["bam"]
bam = ["dep:noodles-bam", "dep:noodles-sam", "dep:noodles-bgzf", "dep:tempfile"]

[profile.dev]
opt-level = 0

[profile.release]
lto = "thin"
debug = true
